# =============================================================================
# Deployment overrides for llama-server (read by run_servers.py).
# Target: GTX 1650 4GB / Ryzen 4800H / 16GB RAM.
# =============================================================================

llm:
  extra_args:
    - "--parallel"
    - "1"
    - "-lv"
    - "1"
    - "-ctk"
    - "q8_0"
    - "-ctv"
    - "q8_0"
    - "--chat-template-kwargs"
    - '{"enable_thinking": false}'
    - "--flash-attn"
    - "on"

embedder:
  extra_args:
    - "-lv"
    - "1"

reranker:
  extra_args:
    - "-lv"
    - "1"
