# =============================================================================
# Deployment overrides for llama-server (read by run_servers.py).
# Optimized for GTX 1650 4GB + Qwen2.5-7B-Instruct (IQ4_XS).
# =============================================================================

llm:
  extra_args:
    - "--parallel"
    - "1"
    - "-lv"
    - "1"
    - "-ctk"
    - "q8_0"
    - "-ctv"
    - "q8_0"
    - "--chat-template-kwargs"
    - '{"enable_thinking": false}'

embedder:
  env:
    CUDA_VISIBLE_DEVICES: ""
    GGML_CUDA_ENABLE: "0"
  extra_args:
    - "-lv"
    - "1"
    - "-ngl"
    - "0"

reranker:
  env:
    CUDA_VISIBLE_DEVICES: ""
    GGML_CUDA_ENABLE: "0"
  extra_args:
    - "-lv"
    - "1"
    - "-ngl"
    - "0"
