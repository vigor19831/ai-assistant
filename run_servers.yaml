# =============================================================================
# Deployment overrides for llama-server (read by run_servers.py).
# Target: GTX 1650 4GB / Ryzen 4800H / 16GB RAM. Current profile: Qwen3.5-4B
# (IQ4_XS, enable_thinking off).
# =============================================================================

llm:
  extra_args:
    - "--parallel"
    - "1"
    - "-lv"
    - "1"
    - "-ctk"
    - "q8_0"
    - "-ctv"
    - "q8_0"
    - "--chat-template-kwargs"
    - '{"enable_thinking": false}'

embedder:
  env:
    CUDA_VISIBLE_DEVICES: ""
    GGML_CUDA_ENABLE: "0"
  extra_args:
    - "-lv"
    - "1"

reranker:
  env:
    CUDA_VISIBLE_DEVICES: ""
    GGML_CUDA_ENABLE: "0"
  extra_args:
    - "-lv"
    - "1"
    - "-ngl"
    - "0"
