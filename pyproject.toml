[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "1.6.0"
description = "Modular AI framework with an immutable core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "numpy>=1.26.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "aiofiles>=23.2.1,<24.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "tokenizers>=0.19.0,<1.0.0",
    "jinja2>=3.1.3,<4.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "anyio>=4.0.0,<5.0.0",
    "starlette>=0.36.0,<1.0.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "pytest-random-order>=1.1.0,<2.0.0",
    "respx>=0.21.0,<1.0.0",
    "hypothesis>=6.100.0,<7.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-PyYAML>=6.0.12,<7.0.0",
    "types-aiofiles>=23.2.0,<24.0.0",
    "packaging>=20.0,<30.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "mutmut>=2.0.0,<3.0.0",
]
faiss = [
    "faiss-cpu>=1.8.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_assistant*"]

[tool.ruff]
line-length = 88
target-version = "py311"
# scripts/ and tests/ now linted (drift #71); vendor/ is binaries.
extend-exclude = ["vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC", "B", "SIM", "C4", "TCH", "A", "ERA", "RUF", "RET"]
ignore = ["TC003", "TC001"]

[tool.ruff.lint.per-file-ignores]
# check_rag.py: benchmark data lives in string literals (queries,
# Russian text, long expected fragments). E501/RUF001-3 there are
# data properties, not code defects: the instrument is edited under
# §13.4 discipline; code moves toward the benchmark, not vice versa.
# ASYNC109: timeout params feed httpx; the retry layer catches httpx
# exceptions. asyncio.timeout would cancel the task with
# CancelledError, bypassing retry — a semantics change with no
# proven defect (§13.4).
"scripts/check_rag.py" = ["E501", "RUF001", "RUF002", "RUF003", "ASYNC109"]

# tests/: blocking sync IO in fixtures is legitimate — ASYNC230/240
# guard the production event loop, not test setup. N806: UPPERCASE
# inline config constants in test bodies are idiomatic.
"tests/*" = ["ASYNC230", "ASYNC240", "N806"]

# clean_cache.py: onerror is deprecated (removal candidate in future
# Python) but required on 3.11 — the project minimum. B028 silenced
# until the minimum passes 3.11, then the whole branch is deleted.
"scripts/clean_cache.py" = ["B028"]

[tool.mypy]
strict = true
ignore_missing_imports = true
# tests/ are checked via explicit CLI call (see check_all.py):
# the global exclude must NOT list tests/ — mypy >=1.18 applies
# exclude even to explicit CLI arguments (silent empty run).
exclude = ["vendor/"]

[tool.pytest.ini_options]
minversion = "8.2"
addopts = "-ra -q --strict-markers --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "online: requires running server",
    "slow: takes >1s",
    "smoke: smoke tests",
    "contract: contract tests",
    "e2e: end-to-end tests",
    "integration: integration tests",
    "regression: regression tests",
]
filterwarnings = [
    "ignore:.*is deprecated.*:DeprecationWarning",
]

[tool.mutmut]
paths_to_mutate = ["src/ai_assistant/core/", "src/ai_assistant/adapters/", "src/ai_assistant/features/", "src/ai_assistant/api/"]
pytest_add_cli_args_test_selection = ["tests/"]
backup = false

[tool.coverage.run]
branch = true
source = ["src/ai_assistant"]

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
