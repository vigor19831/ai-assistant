# =============================================================================
# QUICK START
# 1. Copy this file to config.yaml (cp config.example.yaml config.yaml)
# 2. Replace all placeholders marked with [CHANGE] to match your setup:
#    - API endpoints (api_base) for LLM, Embedder, Reranker
#    - Model names for LLM, Embedder, Reranker
#    - Embedding dimension (must match between embedder and vector_store)
#    - Stop sequences specific to your LLM model
#    - Documents folder path for RAG
#    - GPU settings (n_gpu_layers: layer count 0/20/99, server_context_size) for your VRAM
# 3. Re-index documents after any chunk_size change
# =============================================================================

app_name: ai-assistant
debug: false
host: 127.0.0.1
port: 8000
config_version: "3"

cors:
  allow_origins: ["http://localhost", "http://127.0.0.1"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

chat:
  # Smaller history = more tokens left for RAG context. Keep 4-6 for 4B-class models.
  # History stores clean answers (Sources block stripped, drift #49);
  # refusal answers carry no sources (drift #50).
  history_limit: 4
  # Total token budget for system message + history + current prompt.
  # Must stay below llm.server_context_size minus generation headroom.
  max_context_tokens: 1280
  # Max simultaneous chat requests per process. Tune for your hardware:
  # 2-3 for 4GB VRAM, 5-10 for 16GB RAM.
  max_concurrent_chat: 5

storage:
  provider: sqlite
  db_path: ./data/storage.db

security:
  api_key: local
  admin_enabled: false
  max_body_size: 10485760
  allowed_hosts: ["localhost", "127.0.0.1"]
  openai_routes_require_auth: true

logging:
  level: INFO
  file: ./data/app.log
  format: text
  max_bytes: 10485760
  backup_count: 2

ui:
  static_path: ./ui

# =============================================================================
# EMBEDDER — [CHANGE] api_base and model to match your server
# =============================================================================
embedder:
  provider: openai_compatible
  api_base: http://127.0.0.1:8081/v1
  api_key: null
  # [CHANGE] Model name on your embedding server (e.g. bge-m3, text-embedding-3-small)
  model: your-embedder-model
  # [CHANGE] Must match your model's output dimension (1024 for bge-m3, 1536 for OpenAI, etc.)
  dim: 1024
  timeout: 120.0
  connect_timeout: 10.0
  # [CHANGE] 0 = CPU only. 99 = all layers on GPU (needs 8GB+ VRAM).
  # Read by run_servers.py to build the llama-server launch command.
  n_gpu_layers: 0
  # For testing without a real embedding server, use:
  # provider: mock

# =============================================================================
# RERANKER — [CHANGE] api_base and model to match your server
# =============================================================================
reranker:
  provider: local
  # [CHANGE] Model name on your reranker server
  model: your-reranker-model
  api_base: http://127.0.0.1:8082
  api_key: null
  timeout: 30.0
  # Alternative: cloud API reranker (Cohere / Jina compatible)
  # provider: api
  # api_key: your-api-key-here

# =============================================================================
# VECTOR STORE — [CHANGE] dim must match embedder.dim above
# =============================================================================
vector_store:
  # Default: 'memory' (always available, no extra install).
  # For production with >10k docs: pip install .[faiss] and set provider: faiss
  # Both providers REJECT an add() that would exceed max_chunks (never
  # silently evict): raise max_chunks or delete old chunks if you hit it.
  provider: memory
  index_path: ./data/indices
  metric: cosine
  # [CHANGE] Must match embedder.dim above. A mismatch is detected only
  # at runtime (dim mismatch AdapterError on add/search) — not at startup.
  dim: 1024
  max_chunks: 100000
  max_document_size: 10485760

# =============================================================================
# LLM — [CHANGE] model name and GPU settings for your setup
# =============================================================================
llm:
  provider: openai_compatible
  api_base: http://127.0.0.1:8080/v1
  api_key: null
  # [CHANGE] Put your model name here (e.g. Qwen3-4B-Instruct-2507, gpt-4o-mini)
  model: your-model-name
  # Optional: list available models for OpenAI-compatible endpoints.
  # If empty, the adapter will not expose a /models endpoint.
  # available_models:
  #   - your-model-name
  #   - another-model
  available_models: []
  # [CHANGE] 2048 = safe for 4GB VRAM with CPU offload.
  # With partial GPU offload you can raise this:
  #   6144 @ n_gpu_layers=20 on 4GB VRAM (Qwen2.5-7B)
  #   8192 @ n_gpu_layers=30 on 6GB VRAM
  server_context_size: 2048

  # [CHANGE] GPU layer count. 0 = CPU only; exact counts = partial offload;
  # 99 = all layers (8GB+ VRAM).
  # Measured optimum on 4GB VRAM with Qwen2.5-7B IQ4_XS: 20 (Hardware
  # Ceiling Log). Partial offload in the 9B class caused a PCIe bottleneck
  # — same log. Verify your setting with: python scripts/check_rag.py
  n_gpu_layers: 20

  # [CHANGE] 512 = short answers. 768 = complex multihop answers.
  max_tokens: 512
  # 0.0 = deterministic, mandatory for RAG quality measurement (drift #54;
  # architecture.md §14). Non-zero values make benchmark results
  # non-reproducible. Only raise for creative chat use.
  temperature: 0.0
  top_p: 1.0
  # [CHANGE] REQUIRED for local models. Without stop sequences the model
  # may generate forever or emit special tokens. Examples:
  #   Qwen2.5:  ["<|im_start|>", "用户:", "Human:"]
  #   Llama 3:  ["<|eot_id|>", "<|end_of_text|>"]
  #   Mistral:  ["</s>"]
  #   Command-R: ["<|END_OF_TURN_TOKEN|>"]
  stop_sequences: []
  timeout: 300.0
  connect_timeout: 5.0
  # For testing without a real LLM, use:
  # provider: mock

# =============================================================================
# RAG — [CHANGE] prompt_name and top_k based on test results
# =============================================================================
rag:
  # -------------------------------------------------------------------
  # Pipeline steps (order matters, runs sequentially)
  # Available steps: embed_query, retrieve, multi_query_retrieve,
  #   hyde_query, condense_question, rerank, build_context, generate.
  #
  # STEP DESCRIPTIONS:
  #   embed_query       — embeds the user query into a vector.
  #   retrieve          — searches vector store for top_k * retrieval_multiplier
  #                       candidates, then rerank picks the best top_k.
  #   multi_query_retrieve — generates 2 query variations via LLM, retrieves
  #                       for each, deduplicates. Better recall for synonyms
  #                       and rephrasings. Adds 1 LLM call + 2 extra embed/search.
  #   hyde_query        — generates a hypothetical answer, embeds it, retrieves
  #                       by that embedding. Experimental, slower, not always
  #                       better than multi_query.
  #   condense_question — rewrites follow-up questions using chat history.
  #                       Only useful for multi-turn chat. No effect on
  #                       single-turn API queries.
  #   rerank            — orders retrieved candidates. Never filters by
  #                       absolute score. Requires retrieval_multiplier > 1
  #                       in the reranker adapter to have candidates.
  #   build_context     — formats chunks into [Document N] context string.
  #   generate          — sends context + query to LLM.
  #
  # PIPELINE EXAMPLES (fastest → best recall):
  #   Standard (fastest, good baseline):
  #     [embed_query, retrieve, rerank, build_context, generate]
  #
  #   Multi-query (best recall, +1 LLM call):
  #     [multi_query_retrieve, rerank, build_context, generate]
  #
  #   Multi-query + condense (best for multi-turn chat):
  #     [condense_question, multi_query_retrieve, rerank, build_context, generate]
  #
  #   HyDE (experimental, slowest):
  #     [hyde_query, retrieve, rerank, build_context, generate]
  #
  # TUNING TIPS:
  #   - top_k=2 + prompt_name=rag_strict → less noise, best for factual queries.
  #   - top_k=3 + prompt_name=rag_simple → more recall, use with multi_query.
  #   - Always verify changes with: python scripts/check_rag.py
  #   - retrieval_multiplier is a property of the reranker port, not a
  #     config field: the base port returns 1; LocalReranker/APIReranker
  #     override it to 2. NullReranker keeps 1.
  #   - condense_question adds latency but no quality gain for single-turn.
  #     Skip it if you only use /rag/query API endpoint.
  # -------------------------------------------------------------------
  steps: [embed_query, retrieve, rerank, build_context, generate]
  prompt_version: v1
  # Default pair: rag_strict + top_k 2 — validated at 17/17 CONTRACT
  # (Hardware Ceiling Log). Switch to rag_simple + top_k 3 only if you
  # need more recall, and re-run scripts/check_rag.py after switching.
  prompt_name: rag_strict
  # 2 = less noise, best with rag_strict. 3 = more recall, use with rag_simple.
  top_k: 2
  default_namespace: default
  token_margin_min: 384
  token_margin_pct: 0.10
  sources:
    # Documents are auto-indexed every 60s when the server is running.
    # A changed file gets 3 indexing attempts; after 3 failures the watcher
    # stops retrying it until it changes again or POST /rag/reindex runs.
    # NOTE: one source per namespace — multiple sources sharing a namespace
    # is a known limitation (see drift.md FUTURE RISKS).
    - namespace: default
      # [CHANGE] Your documents folder
      path: ./data/documents
      include: ["*.md", "*.txt"]
      recursive: true
  chat_exports_root: data/chat_exports
  index_chat_exports: false

namespaces:
  default:
    prefix: d
    # [CHANGE] Re-index after changing this.
    chunk_size: 512
    prompt: rag_strict

# =============================================================================
# CHUNKER — choose between simple and recursive
# =============================================================================
chunker:
  # provider: simple   → fixed-size chunks
  # provider: recursive → splits by paragraphs, sentences, words (better retrieval)
  provider: simple
  # [CHANGE] Must match namespace chunk_size above.
  chunk_size: 512
  # [CHANGE] Set to ~10-15% of chunk_size (e.g. 50-100). 0 = no overlap.
  # Overlap is especially important for the simple chunker.
  chunk_overlap: 100

tokenizer:
  # tiktoken = OpenAI models only. For local models (Qwen, Llama, Mistral)
  # download tokenizer via  scripts/download_tokenizers.py  then use:
  #   provider: huggingface
  #   model_name: ./data/tokenizers/your-model/tokenizer.json
  provider: tiktoken
  model_name: cl100k_base
