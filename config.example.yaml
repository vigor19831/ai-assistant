app_name: ai-assistant
debug: false
host: 127.0.0.1
port: 8000
config_version: "1"

cors:
  allow_origins: ["http://localhost", "http://127.0.0.1"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

chat:
  history_limit: 10
  max_context_tokens: 8192  # 4096 for 4B, 8192 for 8B+

storage:
  provider: sqlite
  db_path: ./data/storage.db

security:
  api_key: local
  admin_enabled: false
  max_body_size: 10485760
  allowed_hosts: ["localhost", "127.0.0.1"]
  openai_routes_require_auth: true

logging:
  level: INFO
  file: ./data/app.log
  format: text
  max_bytes: 10485760
  backup_count: 2

ui:
  static_path: ./ui

embedder:
  provider: openai_compatible
  api_base: http://127.0.0.1:8081/v1
  api_key: null
  model: nomic-embed-text-v2-moe  # base name, no quant suffix
  dim: 768  # must match vector_store.dim
  timeout: 60.0
  connect_timeout: 5.0
  n_gpu_layers: 0
  n_batch: 128
  n_ubatch: 32
  mmap: true
  mlock: false

reranker:
  provider: null  # null to disable, local to enable
  model: bge_reranker_v2_m3
  api_base: http://127.0.0.1:8082
  api_key: null
  timeout: 30.0

vector_store:
  provider: faiss
  index_path: ./data/indices
  metric: cosine
  dim: 768  # must match embedder.dim
  max_chunks: 100000
  max_document_size: 10485760

llm:
  provider: openai_compatible
  api_base: http://127.0.0.1:8080/v1
  api_key: null
  model: google_gemma-4-E4B-it  # base name, no quant suffix
  available_models:
    - Qwen_Qwen3.5-4B
    - google_gemma-4-E4B-it
  max_tokens: 1024  # 4B:4096, 8B+:8192, 70B:4096-8192
  temperature: 0.3  # 4B:0.3, 8B+:0.5
  top_p: 0.95
  top_k: 40
  min_p: 0.0
  repeat_penalty: 1.1
  presence_penalty: 0.0
  frequency_penalty: 0.0
  stop_sequences: []
  timeout: 300.0
  connect_timeout: 5.0
  server_context_size: 8192  # 4B:4096, 8B+:32768, 70B:131072
  n_gpu_layers: 999
  n_batch: 32
  n_ubatch: 16
  mmap: true
  mlock: false

rag:
  steps: [embed_query, retrieve, rerank, build_context, generate]
  prompt_version: v1
  prompt_name: rag_strict  # 4B:rag_strict, 8B+:rag_simple
  top_k: 3  # 4B:3, 8B+:10, 70B:15
  default_namespace: test
  token_margin_min: 1024  # 4B:512, 8B+:1024, 70B:4096
  token_margin_pct: 0.15
  sources:
    - namespace: test
      path: ./data/documents/test  # relative path, no machine-specific dirs
      include: ["*.txt"]
      recursive: false
  chat_exports_root: data/chat_exports
  index_chat_exports: false

namespaces:
  test:
    prefix: t
    chunk_size: 256  # 4B:512, 8B+:1024, 70B:2048; reindex after change
    prompt: rag_strict

chunker:
  provider: simple
  chunk_size: 256  # 4B:512, 8B+:1024, 70B:2048
  chunk_overlap: 50

tokenizer:
  provider: tiktoken
  model_name: cl100k_base
