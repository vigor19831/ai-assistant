app_name: ai-assistant
debug: false
host: 127.0.0.1
port: 8000
config_version: "1"

cors:
  allow_origins: ["http://localhost", "http://127.0.0.1"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

chat:
  history_limit: 6                     # 4B model: 5-10 | 8B+: 20-50 | 70B: 100+
  max_context_tokens: 1536              # 4B: 1024-4096 | 8B+: 8192 | 70B: 32768+

storage:
  provider: sqlite
  db_path: ./data/storage.db

security:
  api_key: local
  admin_enabled: false
  max_body_size: 10485760
  allowed_hosts: ["localhost", "127.0.0.1"]
  openai_routes_require_auth: true

logging:
  level: INFO
  file: ./data/app.log
  format: text
  max_bytes: 10485760
  backup_count: 2

ui:
  static_path: ./ui

embedder:
  provider: openai_compatible
  api_base: http://127.0.0.1:8081/v1
  api_key: null
  model: nomic-embed-text-v2-moe        # light: nomic-embed-text-v1.5 | heavy: v2-moe
  dim: 768                              # v1.5: 768 | MiniLM: 384 | must match vector_store.dim
  timeout: 60.0
  connect_timeout: 5.0
  n_gpu_layers: 0                       # 0 = CPU only (save VRAM) | 10+ = if VRAM free
  n_batch: 128                          # 4GB VRAM: 128 | 12GB+: 512
  n_ubatch: 32                          # 4GB: 32 | 12GB+: 128
  mmap: true
  mlock: false

reranker:
  provider: local                       # null = disable (low RAM) | local = enable
  model: bge_reranker_v2_m3
  api_base: http://127.0.0.1:8082
  api_key: null
  timeout: 30.0

vector_store:
  provider: faiss
  index_path: ./data/indices
  metric: cosine
  dim: 768                              # must match embedder.dim
  max_chunks: 100000
  max_document_size: 10485760

llm:
  provider: openai_compatible
  api_base: http://127.0.0.1:8080/v1
  api_key: null
  model: google_gemma-4-E4B-it
  available_models:
    - google_gemma-4-E4B-it
  max_tokens: 1024                      # 4B: 1024-2048 | 8B+: 4096 | 70B: 8192
  temperature: 0.1                      # 4B: 0.1-0.3 | 8B+: 0.5-0.7 | 70B: 0.7-0.9
  top_p: 0.90                           # 4B: 0.90-0.95 | 8B+: 0.95
  top_k: 20                             # 4B: 20-40 | 8B+: 40 | 70B: 40-80
  min_p: 0.0                            # 4B: 0.0 | 8B+: 0.0-0.05 | 70B: 0.05-0.1
  repeat_penalty: 1.15                   # 4B: 1.1-1.15 | 8B+: 1.0-1.05 | 70B: 1.0
  presence_penalty: 0.0                 # 4B: 0.0 | 8B+: 0.0-0.5 | 70B: 0.0-1.0
  frequency_penalty: 0.0                # 4B: 0.0 | 8B+: 0.0-0.5 | 70B: 0.0-1.0
  stop_sequences: []
  timeout: 300.0
  connect_timeout: 5.0
  server_context_size: 4096             # 4B: 2048-4096 | 8B+: 32768 | 70B: 131072
  n_gpu_layers: 999                      # CPU: 0 | 4GB VRAM: 10-15 | 12GB: 25-35 | 24GB+: all
  n_batch: 128                           # 4GB: 64 | 12GB: 128 | 24GB+: 512
  n_ubatch: 64                          # 4GB: 32 | 12GB: 64 | 24GB+: 128
  mmap: true
  mlock: false

rag:
  steps: [embed_query, retrieve, rerank, build_context, generate]
  prompt_version: v1
  prompt_name: rag_strict               # 4B: rag_strict | 8B+: rag_simple
  top_k: 6                              # 4B: 3-8 | 8B+: 10 | 70B: 15
  default_namespace: test
  token_margin_min: 512                 # 4B: 512 | 8B+: 1024 | 70B: 4096
  token_margin_pct: 0.15                # 4B: 0.15 | 8B+: 0.20 | 70B: 0.25
  min_relevance_score: 0.28               # 4B: 0.35 | 8B+: 0.30 | 70B: 0.25 — small models need cleaner context; adjust to your document noise level
  sources:
    - namespace: test
      path: ./data/documents/test
      include: ["*.txt"]
      recursive: false
  chat_exports_root: data/chat_exports
  index_chat_exports: false

namespaces:
  test:
    prefix: t
    chunk_size: 512                     # 4B: 256-512 | 8B+: 1024 | 70B: 2048 (reindex after change)
    prompt: rag_strict                  # 4B: rag_strict | 8B+: rag_simple

chunker:
  provider: simple
  chunk_size: 512                       # 4B: 256-512 | 8B+: 1024 | 70B: 2048
  chunk_overlap: 100                    # 4B: 50-100 | 8B+: 100-200 | 70B: 200-400

tokenizer:
  provider: tiktoken
  model_name: cl100k_base
