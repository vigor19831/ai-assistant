# =============================================================================
# QUICK START
# 1. Change ONLY the paths and GPU settings marked with [CHANGE]
# 2. Re-index documents after any chunk_size change
# =============================================================================

app_name: ai-assistant
debug: false
host: 127.0.0.1
port: 8000
config_version: "2"

cors:
  allow_origins: ["http://localhost", "http://127.0.0.1"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

chat:
  # Smaller history = more tokens left for RAG context. Keep 4-6 for 4B-class models.
  history_limit: 4
  max_context_tokens: 1536

storage:
  provider: sqlite
  db_path: ./data/storage.db

security:
  api_key: local
  admin_enabled: false
  max_body_size: 10485760
  allowed_hosts: ["localhost", "127.0.0.1"]
  openai_routes_require_auth: false

logging:
  level: INFO
  file: ./data/app.log
  format: text
  max_bytes: 10485760
  backup_count: 2

ui:
  static_path: ./ui

# =============================================================================
# EMBEDDER — [CHANGE] api_base to your local server
# =============================================================================
embedder:
  provider: openai_compatible
  api_base: http://127.0.0.1:8081/v1
  api_key: null
  model: bge-m3
  dim: 1024
  timeout: 120.0
  connect_timeout: 10.0
  # [CHANGE] Set to 0 for CPU-only. Set to 999 if GPU has 8GB+ VRAM.
  n_gpu_layers: 0
  n_batch: 128
  n_ubatch: 32
  mmap: true
  mlock: false

# =============================================================================
# RERANKER — [CHANGE] api_base to your local server
# =============================================================================
reranker:
  provider: local
  model: jina-reranker-v2-base-multilingual
  api_base: http://127.0.0.1:8082
  api_key: null
  timeout: 30.0

vector_store:
  provider: faiss
  index_path: ./data/indices
  metric: cosine
  dim: 1024
  max_chunks: 100000
  max_document_size: 10485760

# =============================================================================
# LLM — [CHANGE] these 4 settings for your GPU / VRAM
# =============================================================================
llm:
  provider: openai_compatible
  api_base: http://127.0.0.1:8080/v1
  api_key: null
  model: Qwen3-4B-Instruct-2507
  available_models:
    - google_gemma-4-E4B-it
    - Qwen3-4B-Instruct-2507
  # [CHANGE] Lower if you get out-of-memory errors on the LLM server.
  # 4096 needs ~6GB VRAM. Use 2048 if you only have 4GB.
  server_context_size: 4096

  # [CHANGE] 0 = CPU only. 999 = all layers on GPU (needs 8GB+ VRAM).
  n_gpu_layers: 999

  max_tokens: 768
  temperature: 0.0        # Greedy. Safer for small models.
  top_p: 0.95
  top_k: 1                # Greedy sampling. Increase to 20 if output feels "cut off".
  min_p: 0.0
  repeat_penalty: 1.10
  presence_penalty: 0.0
  frequency_penalty: 0.0
  stop_sequences:
    - "<end_of_turn>"
  timeout: 300.0
  connect_timeout: 5.0
  n_batch: 256
  n_ubatch: 128
  mmap: true
  mlock: false

# =============================================================================
# RAG — [CHANGE] prompt_name and top_k based on test results
# =============================================================================
rag:
  steps: [embed_query, retrieve, rerank, build_context, generate]
  prompt_version: v1
  # Try "rag_simple" first. If check_rag.py fails on noise rejection,
  # switch back to "rag_strict" but keep top_k at 2.
  prompt_name: rag_strict
  # 2 = less noise in context. Increase to 3 only if answers miss facts.
  top_k: 3
  default_namespace: test
  token_margin_min: 384
  token_margin_pct: 0.10
  sources:
    - namespace: test
      # [CHANGE] Your documents folder
      path: D:\rag\test
      include: ["*.txt"]
      recursive: false
  chat_exports_root: data/chat_exports
  index_chat_exports: false

namespaces:
  test:
    prefix: t
    # [CHANGE] Re-index after changing this.
    chunk_size: 384
    prompt: rag_strict

chunker:
  provider: simple
  # [CHANGE] Must match namespace chunk_size above.
  chunk_size: 384
  chunk_overlap: 100

tokenizer:
  provider: tiktoken
  model_name: cl100k_base
